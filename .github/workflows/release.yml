name: CI + Release

# Monorepo: a panel-agnostic core (core/) shared by per-panel adapters
# (panels/<panel>/). PHPUnit runs for every package on push/PR. A release zip
# is built and published when a version tag is pushed.
#
# Tag conventions (both supported):
#   v0.5.15          -> builds the Plesk panel (legacy/back-compatible)
#   plesk-v0.5.15    -> builds panels/plesk
#   directadmin-v0.1.0 -> builds panels/directadmin (when it exists)

on:
  push:
    branches: [main]
    tags: ['v*', '*-v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.package }} · PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 = composer.json floor; 8.3 = the PHP Plesk Obsidian ships; 8.4/8.5
        # = forward-looking, so the extension stays ready as Plesk bumps PHP.
        php: ['8.1', '8.3', '8.4', '8.5']
        package: ['core', 'panels/plesk']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: composer install --prefer-dist --no-progress

      - name: Audit dependencies
        working-directory: ${{ matrix.package }}
        run: composer audit --no-interaction

      - name: Run PHPUnit
        working-directory: ${{ matrix.package }}
        run: vendor/bin/phpunit

  release:
    name: Build + publish release zip
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for softprops/action-gh-release to publish
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag into <panel> + <version>
        id: tag
        # Accepts both "vX.Y.Z" (legacy -> plesk) and "panel-vX.Y.Z".
        run: |
          REF="$GITHUB_REF_NAME"
          if [[ "$REF" == *-v* ]]; then
            PANEL="${REF%%-v*}"
            VERSION="${REF#*-v}"
          else
            PANEL="plesk"
            VERSION="${REF#v}"
          fi
          echo "panel=$PANEL"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build install package
        run: build/build-panel.sh "${{ steps.tag.outputs.panel }}" "${{ steps.tag.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cloudflare-dns-sync-*.zip
          generate_release_notes: true
